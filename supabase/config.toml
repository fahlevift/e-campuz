[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.materials]
public = false
file_size_limit = "50MiB"

[storage.buckets.submissions]
public = false
file_size_limit = "25MiB"

[storage.buckets.chat-attachments]
public = false
file_size_limit = "25MiB"

[storage.buckets.ticket-attachments]
public = false
file_size_limit = "10MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
